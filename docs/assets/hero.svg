<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc"><title id="title">GhostWords — Hear the evidence</title><desc id="desc">An editorial illustration of a waveform with an unexpected transcript line over silence.</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#d9dfd2" stroke-width=".6"/></pattern></defs><rect width="1440" height="560" rx="20" fill="#f2f2e9"/><rect width="1440" height="560" rx="20" fill="url(#grid)"/><rect x="60" y="51" width="48" height="48" rx="15" fill="#225d49"/><path d="M72 79a14 14 0 1 1 28 0v11l-5-3-5 3-5-3-5 3-8-4z" fill="#eff0e4"/><circle cx="81" cy="76" r="2" fill="#225d49"/><circle cx="91" cy="76" r="2" fill="#225d49"/><text x="123" y="83" fill="#263427" font-family="Arial,sans-serif" font-size="29" font-weight="700">GhostWords</text><text x="63" y="170" fill="#6d7c68" font-family="monospace" font-size="13" letter-spacing="3">THE AUDIO EVIDENCE DESK</text><text x="59" y="246" fill="#202821" font-family="Arial,sans-serif" font-size="63" letter-spacing="-2">Read what it wrote.</text><text x="59" y="320" fill="#225d49" font-family="Georgia,serif" font-size="63" font-style="italic">Hear what was there.</text><text x="63" y="372" fill="#6d7867" font-family="Arial,sans-serif" font-size="18">Local audio. Visible evidence. Human decisions.</text><rect x="63" y="415" width="133" height="35" rx="5" fill="#e0e8d8"/><text x="80" y="438" font-family="monospace" font-size="12" fill="#466044">OPEN SOURCE</text><rect x="207" y="415" width="123" height="35" rx="5" fill="#e0e8d8"/><text x="224" y="438" font-family="monospace" font-size="12" fill="#466044">LOCAL ONLY</text><g transform="translate(807,126)"><rect width="565" height="300" rx="14" fill="#fffef8" stroke="#cad5c2"/><text x="24" y="35" fill="#72826b" font-family="monospace" font-size="11" letter-spacing="2">AUDIO / 00:03.200 — 00:05.000</text><path d="M25 110h20m0 0v-10m7 10V78m7 32v37m7-37V61m7 49v56m7-56V76m7 34v26m7-26V83m7 27v45m7-45V68m7 42v18m7-18V84m7 26v39m7-39V73m7 37v12m7-12V96m7 14h132m0 0v-10m7 10V68m7 42v48m7-48V80m7 30v42m7-42V62m7 48v16m7-16V76m7 34v45m7-45V91m7 19h35" fill="none" stroke="#3b775d" stroke-width="4" stroke-linecap="round"/><rect x="196" y="61" width="137" height="108" rx="5" fill="#d9a571" opacity=".15"/><path d="M263 168v29" fill="none" stroke="#ad713f" stroke-dasharray="3 3"/><rect x="24" y="197" width="517" height="78" rx="7" fill="#f5eada"/><circle cx="49" cy="222" r="5" fill="#be854e"/><text x="66" y="226" fill="#925b2d" font-family="Arial,sans-serif" font-size="13" font-weight="700">Text over quiet audio</text><text x="44" y="252" fill="#726b5c" font-family="Arial,sans-serif" font-size="13">“Thank you for watching. Please subscribe.”</text></g><text x="63" y="518" fill="#8c9884" font-family="monospace" font-size="11" letter-spacing="1">BUILT BY UFODIA · MIT LICENSE · NO API KEY REQUIRED</text></svg>
